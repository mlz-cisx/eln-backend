version: '3.8'

# file structure
# .
# ├── frontend/
# │   └── Dockerfile
# ├── backend/
# │   └── Dockerfile
# └── docker-compose.yml
#
# docker-compose build
# docker-compose up

services:
  eln-backend:
    image: eln-backend
    build:
      context: ./backend
    ports:
      - "8010:8010"
    env_file: .env
    command: ["uvicorn", "joeseln_backend.main:app", "--reload", "--port", "8010", "--host", "0.0.0.0", "--loop", "asyncio"]
    volumes:
      - ./data/pictures/:/data/pictures
      - ./data/files/:/data/files
    depends_on:
      eln-postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8010 && printf 'GET /api/health/ HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eln-backend-websocket:
    image: eln-backend
    build:
      context: ./backend
    ports:
      - "8011:8011"
    env_file: .env
    command: ["python", "-m", "joeseln_backend.ws.ws_server"]
    depends_on:
      eln-postgres:
        condition: service_healthy

  eln-frontend:
    image: eln-frontend
    build:
      context: ./frontend/
    environment:
      SERVER_NAME: "<SERVER_NAME>"
      API_URL: "<API_URL>"
      WS_URL: "<WS_URL>"
      KEYCLOAK_INTEGRATION: "<KEYCLOAK_INTEGRATION>"
      KEYCLOAK_BEHIND_NGINX: "<KEYCLOAK_BEHIND_NGINX>"
      INSTR_CSV_ALL: "<INSTR_CSV_ALL>"
    ports:
      - "80:80"
      - "443:443"
    # bind certificates if enable HTTPS
    # volumes:
    #   - "/path/to/cert:/etc/nginx/certs/server.crt"
    #   - "/path/to/key:/etc/nginx/certs/server.key"

  eln-postgres:
    image: postgres:17
    env_file: .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


  keycloak:
    # ports:
    #   - 8080:8080
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    image: quay.io/keycloak/keycloak:26.1.4
    volumes:
        - ./data/keycloak_data:/opt/keycloak/data
    command: start-dev --http-relative-path /keycloak --proxy-headers xforwarded --http-enabled=true

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    volumes:
      - ./data/typesense_data:/data
    command:
      - --data-dir
      - /data
      - --api-key
      - ${TYPESENSE_API_KEY}
      - --enable-cors
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  playwright:
    ports:
      - "3000:3000"
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    command: /bin/sh -c "npx -y playwright@1.58.0 run-server --port 3000 --host
        0.0.0.0"

